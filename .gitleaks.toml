# Secret scanning configuration.
#
# Extends the default rule set rather than replacing it: the built-in rules are
# far better maintained than anything written here would be.
#
# There is deliberately no allowlist. The guardrail fixture that tests this gate
# stores placeholders and materialises a credential-shaped value at runtime,
# outside the repository — so nothing here needs excusing. An allowlist entry is
# permanent, and everything in the path it covers becomes invisible to this gate
# forever after.
[extend]
useDefault = true
